name: Trigger Notification Retry Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Secrets (Güvenli)
        run: |
          echo "APP_URL tanımlı mı?: ${{ secrets.APP_URL != '' }}"
          echo "CRON_SECRET tanımlı mı?: ${{ secrets.CRON_SECRET != '' }}"
          
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "❌ HATA: APP_URL secret'ı GitHub'da tanımlanmamış!"
            exit 1
          fi
          
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "❌ HATA: CRON_SECRET secret'ı GitHub'da tanımlanmamış!"
            exit 1
          fi

      - name: Call Cron Endpoint
        run: |
          # URL'de sondaki / temizlenir (çift / oluşmasını engeller)
          BASE_URL="${{ secrets.APP_URL }}"
          BASE_URL="${BASE_URL%/}"
          
          FULL_URL="${BASE_URL}/api/cron/notifications"
          echo "🚀 İstek atılan adres: $FULL_URL"
          
          # curl'ü verbose modda çalıştırıp yanıt kodunu ve gövdeyi al
          RESPONSE_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$FULL_URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          echo "📥 Gelen HTTP Kodu: $RESPONSE_CODE"
          echo "📄 Yanıt İçeriği:"
          cat response.txt
          echo ""
          
          # Başarılı kodları kontrol et (200, 201, 202 kabul edilebilir)
          if [[ "$RESPONSE_CODE" =~ ^(200|201|202)$ ]]; then
            echo "✅ Cron başarıyla tetiklendi!"
          else
            echo "❌ Cron tetikleme başarısız! HTTP Kodu: $RESPONSE_CODE"
            exit 1
          fi
